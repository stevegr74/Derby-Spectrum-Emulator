name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-cpu-compliance:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.3xx

      - name: Restore
        run: dotnet restore Derby.sln

      - name: Build
        run: dotnet build Derby.sln -c Release --no-restore

      - name: Run automated tests
        run: dotnet test Derby.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Run ZEXDOC
        run: dotnet run -c Release --project Derby.Z80Compliance --no-build -- test-assets/z80/zexdoc.com 7000000000

      - name: Run ZEXALL
        run: dotnet run -c Release --project Derby.Z80Compliance --no-build -- test-assets/z80/zexall.com 7000000000

      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
